name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  packages: write

jobs:
  # Nothing is published from a tag whose code doesn't pass its own tests.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Test the Go code
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test the frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: create_release
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          # Any semver prerelease suffix, the same rule release-oci uses to
          # keep a prerelease off the floating image tags.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

  release-binary:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Build
        run: |
          make build
          cp ./bin/gitlab-achievements ./gitlab-achievements_${{ matrix.os }}_${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          GO111MODULE: on

      - name: Upload binaries
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./gitlab-achievements_${{ matrix.os }}_${{ matrix.arch }}
          asset_name: gitlab-achievements_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the release, so an image is never published for a release that
  # failed to be created.
  release-oci:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The tag reaches the script through the environment, never spliced
      # into it, and must be a strict semantic version before anything uses
      # it: the trigger's glob also matches tags like v1.0.0$(cmd), which
      # are valid git refs.
      - name: Set up version variables
        id: vars
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error::the release tag is not a semantic version (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          VERSION_NO_PREFIX=${VERSION#v}
          MAJOR=${BASH_REMATCH[1]}
          MINOR=${BASH_REMATCH[2]}
          PRERELEASE=${BASH_REMATCH[4]}
          REPO_NAME=$(tr '[:upper:]' '[:lower:]' <<< "$REPOSITORY")
          # A prerelease gets its exact tag only: :latest, :MAJOR and
          # :MAJOR.MINOR are what people track, and an RC must not move them.
          {
            echo "tags<<EOF"
            echo "ghcr.io/$REPO_NAME:$VERSION_NO_PREFIX"
            if [[ -z "$PRERELEASE" ]]; then
              echo "ghcr.io/$REPO_NAME:$MAJOR.$MINOR"
              echo "ghcr.io/$REPO_NAME:$MAJOR"
              echo "ghcr.io/$REPO_NAME:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$VERSION"
            echo "VERSION_NO_PREFIX=$VERSION_NO_PREFIX"
            echo "MAJOR=$MAJOR"
            echo "MINOR=$MINOR"
            echo "REPO_NAME=$REPO_NAME"
            echo "CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          sbom: true
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.url=ghcr.io/boxboxjason/gitlab-achievements
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.vendor=${{ github.repository_owner}}
          tags: ${{ steps.vars.outputs.tags }}
