{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gitlab-achievements.serviceAccountName" . }}
  labels:
    {{- include "gitlab-achievements.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app talks to GitLab and to its database, never to the Kubernetes API, so
# it is given no token to talk to one with.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
