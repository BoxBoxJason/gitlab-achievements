apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitlab-achievements.fullname" . }}
  labels:
    {{- include "gitlab-achievements.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gitlab-achievements.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.enabled }}
---
{{- /*
Metrics get a Service of their own, always ClusterIP, so that publishing
the app (service.type LoadBalancer or NodePort) never publishes them too.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitlab-achievements.fullname" . }}-metrics
  labels:
    {{- include "gitlab-achievements.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "gitlab-achievements.selectorLabels" . | nindent 4 }}
{{- end }}
