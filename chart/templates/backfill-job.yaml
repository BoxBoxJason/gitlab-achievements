{{- if .Values.backfillJob.enabled }}
{{- if eq .Values.config.backfill.mode "auto" }}
{{- fail "backfillJob.enabled with config.backfill.mode=auto would walk the instance's history twice: set config.backfill.mode to off" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gitlab-achievements.fullname" . }}-backfill
  labels:
    {{- include "gitlab-achievements.labels" . | nindent 4 }}
    app.kubernetes.io/component: backfill
spec:
  backoffLimit: {{ .Values.backfillJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.backfillJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      {{- with .Values.backfillJob.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gitlab-achievements.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backfill
    spec:
      # The walk is resumable: a killed pod picks up near where it stopped
      # rather than starting over, so a restart is cheap and safe.
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gitlab-achievements.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backfill
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - backfill
          env:
            {{- include "gitlab-achievements.env" . | nindent 12 }}
            # The subcommand walks whatever the mode says, so this only
            # selects whether a finished walk is repeated.
            - name: BACKFILL
              value: {{ ternary "force" "auto" .Values.backfillJob.force | quote }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- include "gitlab-achievements.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.backfillJob.resources | nindent 12 }}
      {{- with .Values.backfillJob.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backfillJob.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backfillJob.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
