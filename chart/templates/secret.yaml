{{- if not .Values.secrets.existingSecret }}
{{- $required := list
      (dict "key" "secrets.gitlabReadToken" "value" .Values.secrets.gitlabReadToken)
      (dict "key" "secrets.gitlabWriteToken" "value" .Values.secrets.gitlabWriteToken)
      (dict "key" "secrets.webhookSecret" "value" .Values.secrets.webhookSecret)
      (dict "key" "secrets.databaseDsn" "value" .Values.secrets.databaseDsn) }}
{{- range $entry := $required }}
{{- if not $entry.value }}
{{- fail (printf "%s is required, unless secrets.existingSecret names a Secret you manage yourself" $entry.key) }}
{{- end }}
{{- end }}
{{- if eq .Values.secrets.gitlabReadToken .Values.secrets.gitlabWriteToken }}
{{- fail "secrets.gitlabReadToken and secrets.gitlabWriteToken must be two different credentials: the write token is deliberately the only one with instance-admin rights" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab-achievements.fullname" . }}
  labels:
    {{- include "gitlab-achievements.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITLAB_READ_TOKEN: {{ .Values.secrets.gitlabReadToken | quote }}
  GITLAB_WRITE_TOKEN: {{ .Values.secrets.gitlabWriteToken | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  DATABASE_DSN: {{ .Values.secrets.databaseDsn | quote }}
  {{- with .Values.secrets.oauthClientSecret }}
  OAUTH_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
