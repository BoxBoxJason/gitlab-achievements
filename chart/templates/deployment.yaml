apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitlab-achievements.fullname" . }}
  labels:
    {{- include "gitlab-achievements.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gitlab-achievements.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.secrets.existingSecret }}
        # Rotating a token in values.yaml rolls the pod, instead of leaving it
        # running with the credential it started with.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gitlab-achievements.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gitlab-achievements.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.frontend.enabled }}
      initContainers:
        # Copies the built frontend out of its image into a volume the app
        # serves it from, so the frontend ships on its own release cadence.
        - name: frontend
          image: "{{ required "frontend.image.repository is required when frontend.enabled" .Values.frontend.image.repository }}:{{ required "frontend.image.tag is required when frontend.enabled" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command: ["sh", "-c", "cp -R \"$SOURCE\"/. /frontend/"]
          env:
            - name: SOURCE
              value: {{ .Values.frontend.sourcePath | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: frontend
              mountPath: /frontend
      {{- end }}
      containers:
        - name: gitlab-achievements
          image: {{ include "gitlab-achievements.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ include "gitlab-achievements.containerPort" . }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            {{- if eq (toString .Values.metrics.port) (include "gitlab-achievements.containerPort" .) }}
            {{- fail (printf "metrics.port must differ from the app's own port %s" (include "gitlab-achievements.containerPort" .)) }}
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "gitlab-achievements.env" . | nindent 12 }}
            - name: BACKFILL
              value: {{ .Values.config.backfill.mode | quote }}
            - name: RECONCILE
              value: {{ .Values.config.reconcile.mode | quote }}
            {{- if .Values.frontend.enabled }}
            - name: FRONTEND_DIR
              value: /frontend
            {{- end }}
            - name: METRICS_ADDR
              value: {{ ternary (printf ":%v" .Values.metrics.port) "off" .Values.metrics.enabled | quote }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- include "gitlab-achievements.envFrom" . | nindent 12 }}
          {{- if .Values.startupProbe.enabled }}
          # Nothing is served until bootstrap finishes, so this probe is what
          # decides how long a first start is allowed to take. See values.yaml.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $mounts := include "gitlab-achievements.volumeMounts" . }}
          {{- if or $mounts .Values.frontend.enabled }}
          volumeMounts:
            {{- with $mounts }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.frontend.enabled }}
            - name: frontend
              mountPath: /frontend
              readOnly: true
            {{- end }}
          {{- end }}
      {{- $volumes := include "gitlab-achievements.volumes" . }}
      {{- if or $volumes .Values.frontend.enabled }}
      volumes:
        {{- with $volumes }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.frontend.enabled }}
        - name: frontend
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
