{{- include "gitlab-achievements.validateApiAuth" . }}
{{- include "gitlab-achievements.validateSecrets" . }}
{{- /* frontend.* was removed in 0.4.0: the image now serves its own frontend. Fail rather than silently replace a custom one. */}}
{{- if (.Values.frontend).enabled }}
{{- fail "frontend.* was removed in chart 0.4.0: the image now serves its own frontend at /. To serve a different one, set FRONTEND_DIR through config.extraEnv and mount the files yourself (see docs/frontend.md)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitlab-achievements.fullname" . }}
  labels:
    {{- include "gitlab-achievements.labels" . | nindent 4 }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gitlab-achievements.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gitlab-achievements.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gitlab-achievements.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: gitlab-achievements
          image: {{ include "gitlab-achievements.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ include "gitlab-achievements.containerPort" . }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            {{- if eq (toString .Values.metrics.port) (include "gitlab-achievements.containerPort" .) }}
            {{- fail (printf "metrics.port must differ from the app's own port %s" (include "gitlab-achievements.containerPort" .)) }}
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "gitlab-achievements.env" . | nindent 12 }}
            {{- with (include "gitlab-achievements.credentialEnv" .) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: BACKFILL
              value: {{ .Values.config.backfill.mode | quote }}
            - name: RECONCILE
              value: {{ .Values.config.reconcile.mode | quote }}
            - name: METRICS_ADDR
              value: {{ ternary (printf ":%v" .Values.metrics.port) "off" .Values.metrics.enabled | quote }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (include "gitlab-achievements.envFrom" .) }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          # Nothing is served until bootstrap finishes, so this probe is what
          # decides how long a first start is allowed to take. See values.yaml.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with (include "gitlab-achievements.volumeMounts" .) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with (include "gitlab-achievements.volumes" .) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
