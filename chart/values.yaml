# Default values for gitlab-achievements.
# See docs/deployment/kubernetes.md for a walkthrough, and docs/configuration.md
# for what every setting under `config` does.

# -- Keeps the chart's -chart suffix out of the names of the objects it creates.
nameOverride: gitlab-achievements
fullnameOverride: ""

image:
  repository: ghcr.io/boxboxjason/gitlab-achievements
  # Pin this to a released version in production; empty falls back to the
  # chart's appVersion.
  tag: ""
  # Optional content digest, e.g. sha256:47c8... (no leading @). When set it
  # is appended to the reference as repository:tag@digest, so the runtime
  # pulls exactly that image and the tag is only a label for humans.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The app is a singleton by design: one process registers the instance's
# webhooks, runs the hourly reconciliation sweeps, and walks history. A second
# replica would duplicate all three against the same GitLab instance, so the
# chart deploys one and replaces it rather than running two side by side.
replicaCount: 1
strategy:
  type: Recreate

config:
  # Base URL of the GitLab instance to mirror, e.g. https://gitlab.example.com.
  gitlabUrl: ""
  # Full path of the namespace that owns the achievement definitions.
  achievementsNamespace: ""
  # Externally reachable base URL of this app. GitLab's webhooks are registered
  # against it, so the instance must be able to resolve and reach it.
  publicUrl: ""
  # debug, info, warn, error.
  logLevel: info
  # auto, group, or project. auto picks group hooks where the license allows.
  hookScope: auto
  # Groups or projects per second the webhook registration sweep works through.
  hookRate: 20
  backfill:
    # auto, off, or force. Set to off when the cold start should run as the
    # separate Job below rather than in the serving pod.
    mode: auto
    # How far back history is walked: a date (2024-01-01) or a duration (720h).
    # Empty walks everything.
    since: ""
    # Requests per second the historical walk is allowed to issue. It caps
    # the reconciliation sync below too: both are instance-wide read sweeps.
    rate: 5
  reconcile:
    # Periodic re-read of recent activity, healing webhook deliveries GitLab
    # never managed to make. auto runs it in the serving pod, shortly after
    # startup and on the interval below. off disables it, for a deployment
    # scheduling `gitlab-achievements reconcile` from outside the chart.
    mode: auto
    # How often recent activity is re-read.
    interval: 24h
    # How far back each pass reaches. Must exceed the interval, so
    # consecutive windows overlap rather than abut; the app refuses to start
    # otherwise.
    lookback: 48h
  api:
    # none or gitlab. gitlab verifies a GitLab token on every API request.
    auth: none
    # Client ID of a hand-registered OAuth application. Empty lets the app
    # register a public one for itself when auth is gitlab.
    oauthClientId: ""
    # Full path of a GitLab group; only its members (and instance admins)
    # may use the API. Empty admits any GitLab user.
    allowedGroup: ""
    # How long a verified GitLab credential is trusted before asking GitLab
    # again. Also how long a revoked token keeps working. 0s disables.
    authCacheTTL: 1m
    # How long a browser stays signed in. Sessions renew their GitLab token
    # as it runs out, so this is how often people log in again.
    sessionLifetime: 168h
    # Origins besides publicUrl's a login may send the browser back to,
    # e.g. a frontend served from its own host.
    returnOrigins: []
    #  - https://rankings.example.com
  # Who takes part. See docs/participation.md.
  exclusions:
    # Leave out the accounts GitLab flags as bots: project and group access
    # token users, service accounts, GitLab's own bots.
    bots: true
    # Usernames or GitLab user IDs to leave out.
    users: []
    #  - renovate
    #  - "1234"
    # Regular expression (RE2); matching usernames are left out.
    usernamePattern: ""
    # Let users opt themselves out through the API. Only takes effect with
    # api.auth: gitlab, since the API has to know who is asking.
    allowOptOut: true
  # Extra environment variables, appended last so they can override anything
  # above. Standard Kubernetes env entries, so valueFrom works.
  extraEnv: []
  #  - name: GOMEMLIMIT
  #    value: "400MiB"

secrets:
  # Name of a Secret you manage yourself (External Secrets, SOPS, sealed
  # secrets...). It is loaded with envFrom, so its keys must be named
  # GITLAB_READ_TOKEN, GITLAB_WRITE_TOKEN, WEBHOOK_SECRET, DATABASE_DSN and,
  # where applicable, OAUTH_CLIENT_SECRET and SESSION_SECRET (required with
  # config.api.auth: gitlab). Set it and leave the values below empty, or
  # leave it empty and let the chart create the Secret from them.
  existingSecret: ""
  # GitLab token with read_api scope, used for all data fetching.
  gitlabReadToken: ""
  # GitLab token with api scope belonging to the instance-admin service
  # account, used to manage webhooks and achievements. See docs/gitlab-setup.md
  # for what trusting this credential to a cluster implies.
  gitlabWriteToken: ""
  # Shared secret GitLab presents on every webhook delivery.
  webhookSecret: ""
  # Database connection string. Left empty, it defaults to a SQLite file under
  # persistence.mountPath, backed by the PVC below. Point it at a PostgreSQL,
  # MySQL, or SQL Server you manage instead, e.g.
  # postgres://user:password@postgres.databases.svc:5432/achievements?sslmode=require
  # — in which case persistence can be disabled, since nothing local needs it.
  databaseDsn: ""
  # Only needed alongside config.api.oauthClientId for a confidential client.
  oauthClientSecret: ""
  # Key for encrypting the GitLab tokens browser sessions hold, at least 32
  # characters. Required when config.api.auth is gitlab; generate one with
  # `openssl rand -base64 48`. Changing it signs everybody out.
  sessionSecret: ""

# Backs the default SQLite database with a PersistentVolumeClaim, mounted at
# persistence.mountPath. Ignored if secrets.databaseDsn points at a database
# you manage elsewhere (PostgreSQL, MySQL, SQL Server) — disable it then, so
# the release doesn't carry an unused volume.
persistence:
  enabled: true
  # Claim the chart creates. Set to use one you already have instead; the
  # chart neither creates nor deletes it, and size/storageClassName/accessMode
  # below are ignored.
  existingClaim: ""
  size: 1Gi
  # Empty uses the cluster's default StorageClass.
  storageClassName: ""
  accessMode: ReadWriteOnce
  # Directory the volume is mounted at. The default SQLite DSN points inside it.
  mountPath: /data

# A static frontend (a rankings page) served at "/" on the same origin as the
# API, so it can use the login session without any CORS. Its built files are
# copied out of an image of your own by an init container, which needs a
# shell and cp. See docs/frontend.md, which also covers serving the frontend
# separately behind the same Ingress host instead.
frontend:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  # Directory inside that image holding index.html and the built assets.
  sourcePath: /usr/share/nginx/html
  resources: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Prometheus metrics, served on a port of their own so the Ingress (which
# routes to the http port only) never exposes them. See docs/metrics.md.
metrics:
  enabled: true
  port: 9464
  serviceMonitor:
    # Requires the Prometheus Operator's CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. the release label your Prometheus selects on.
    labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: achievements.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: gitlab-achievements-tls
  #    hosts:
  #      - achievements.example.com

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Bootstrap runs before the HTTP server listens, and on a Free-tier instance it
# registers a webhook on every project there is, so the first probe to succeed
# can be many minutes after the container starts. The startup probe is what
# grants that time: liveness and readiness only begin once it passes, so raise
# its failureThreshold rather than the others' on a large instance.
# 60 x 10s = 10 minutes by default.
startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 60

livenessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# /readyz checks the database and GitLab are reachable right now, so a pod goes
# unready during a GitLab outage and the Service stops routing to it.
readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Shutdown drains webhook deliveries GitLab has already been told succeeded.
terminationGracePeriodSeconds: 60

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# One-off historical walk as its own Job, for instances big enough that the
# cold start shouldn't be something a serving pod does in the background. Set
# config.backfill.mode to off when you enable this. The Job is not a Helm hook:
# it is created alongside the release and runs to completion once. Re-running
# it means deleting it and upgrading again.
backfillJob:
  enabled: false
  # Walks history again even if a previous walk finished.
  force: false
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Removes what this app put on the GitLab instance: the event ingestion
# webhooks it registered and the achievement definitions it created. Enable it,
# upgrade, watch it finish, and only then `helm uninstall`, which removes the
# workload but nothing on GitLab.
#
# Scale the Deployment to zero first. A running server re-registers the hooks on
# its next reconciliation sweep and recreates the achievements on its next
# start, so removing them underneath it accomplishes nothing.
#
# It is deliberately not a pre-delete hook: deleting an achievement deletes
# every award of it, so the badges disappear from the profile of everyone who
# earned one and nothing brings those back. That must be something you ask for,
# not something `helm uninstall` does on your behalf.
uninstallJob:
  enabled: false
  # Report what would be removed and call nothing. Worth one run of its own
  # before the real thing.
  dryRun: false
  # Remove only the webhooks, leaving people the badges they earned.
  keepAchievements: false
  # Also enumerate the instance for hooks and achievements this app has no
  # record of, for a database that was lost or restored from an old backup.
  # Costs a full walk of every group or project, so it is not the default.
  sweep: false
  backoffLimit: 3
  # Kept long enough to read the logs afterwards, which are the only report of
  # what was removed and what was left behind.
  ttlSecondsAfterFinished: 86400
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
