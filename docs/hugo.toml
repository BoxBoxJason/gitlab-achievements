baseURL = "https://boxboxjason.github.io/gitlab-achievements/"
title = "GitLab Achievements"
locale = "en-US"

# "Last updated" dates on pages come from git history, so CI must check out all of it.
enableGitInfo = true
enableRobotsTXT = true

# Hugo does not merge `markup` from a theme: keep this block in every site.
[markup]
  [markup.highlight]
    noClasses = false

# Look and feel (colours, favicon, footer, search, ...) come from the shared theme,
# which is the same for every documentation site. Only project specifics live here.
[module]
  [[module.imports]]
    path = "github.com/boxboxjason/hugo-theme"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  # The Helm chart README is generated from chart/values.yaml by helm-docs (make helm/docs):
  # the site publishes it as is rather than keeping a copy.
  [[module.mounts]]
    source = "../chart/README.md"
    target = "content/docs/deployment/helm-values.md"

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Releases"
    url = "https://github.com/BoxBoxJason/gitlab-achievements/releases"
    weight = 2
  [[menu.main]]
    name = "Search"
    weight = 3
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 4
    url = "https://github.com/BoxBoxJason/gitlab-achievements"
    [menu.main.params]
      icon = "github"

[params]
  [params.editURL]
    base = "https://github.com/BoxBoxJason/gitlab-achievements/edit/main/docs/content"
